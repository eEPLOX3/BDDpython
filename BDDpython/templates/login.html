<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema Escolar</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <div class="logo">
                    <i class="fas fa-graduation-cap"></i>
                    <h1>EduControl</h1>
                </div>
                <p>Acceda a su cuenta para continuar</p>
            </div>

            {% if error %}
            <div class="alert alert-error">
                <i class="fas fa-exclamation-circle"></i> {{ error }}
            </div>
            {% endif %}

            <form action="{{ url_for('auth') }}" method="POST" id="loginForm">
                <div class="form-group">
                    <label for="tipo_usuario">Tipo de Usuario</label>
                    <select name="tipo_usuario" id="tipo_usuario" class="form-control" required>
                        <option value="alumno">Alumno</option>
                        <option value="profesor">Profesor</option>
                        <option value="superadmin">Administrador</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="codigo">Código / Usuario</label>
                    <input type="text" name="codigo" id="codigo" class="form-control" placeholder="Ej: ALU001 o ADMIN"
                        required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="password-container">
                        <input type="password" name="password" id="password" class="form-control" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fas fa-sign-in-alt"></i> Ingresar
                </button>
            </form>
        </div>

        <div class="demo-credentials">
            <h3>Información del Sistema</h3>
            <div class="credentials-grid">
                <div class="credential-card">
                    <h4>Identificación</h4>
                    <p>El sistema detectará automáticamente su perfil según el código ingresado.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Tu lógica de auto-selección de PHP ahora en el HTML
        document.getElementById('codigo').addEventListener('input', function () {
            const valor = this.value.toUpperCase();
            const tipoSelect = document.getElementById('tipo_usuario');

            if (valor.startsWith('ALU')) {
                tipoSelect.value = 'alumno';
            } else if (valor.startsWith('PROF')) {
                tipoSelect.value = 'profesor';
            } else if (valor.includes('ADMIN')) {
                tipoSelect.value = 'superadmin';
            }
        });
    </script>
</body>

</html>
